[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bola-timestamp-normalizer"
version = "0.1.0"
description = "Rescale timestamp columns onto a configurable target date period."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
test = ["pytest>=8.0"]
ci = ["pandas>=2.0", "pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["timestamp_normalizer"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
